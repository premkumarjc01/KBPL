<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KBPL Dealer Master</title><script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script><style>:root{--g:#087f68;--d:#123b36;--bg:#f4f8f6;--l:#dce7e2;--m:#6b7e78}*{box-sizing:border-box}body{margin:0;font:14px Segoe UI,Arial;background:var(--bg);color:#18322d}header{background:linear-gradient(135deg,var(--d),#119273);color:white;padding:18px 24px;display:flex;justify-content:space-between}h1{margin:0;font-size:22px}.wrap{max-width:1500px;margin:auto;padding:18px}.bar,.card,.panel{background:#fff;border:1px solid var(--l);border-radius:14px;box-shadow:0 4px 16px #123b3610}.bar{padding:14px;display:grid;grid-template-columns:130px 1fr 1fr 1.5fr auto auto auto;gap:9px}.f label{display:block;font-size:10px;text-transform:uppercase;font-weight:700;color:var(--m);margin-bottom:5px}.f select,.f input,textarea{width:100%;padding:10px;border:1px solid var(--l);border-radius:8px;background:#fbfdfc}.btn{border:0;border-radius:8px;padding:10px 13px;font-weight:700;cursor:pointer;background:var(--g);color:#fff}.alt{background:#eaf2ef;color:var(--d)}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:14px 0}.card{padding:13px}.card small{color:var(--m);font-weight:700}.card b{display:block;font-size:21px;margin-top:4px}.panel{overflow:hidden}.ph{padding:13px 16px;border-bottom:1px solid var(--l);display:flex;justify-content:space-between}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:10px;border-bottom:1px solid #edf2f0;text-align:left;white-space:nowrap}th{background:#f7faf8;color:var(--m);font-size:10px;text-transform:uppercase;position:sticky;top:0}tbody tr:hover{background:#f0f8f5;cursor:pointer}.tag{padding:4px 7px;border-radius:15px;font-size:10px;font-weight:700;background:#fff1da;color:#9b5e0a}.ok{background:#e1f6ee;color:#087154}.empty{text-align:center;padding:35px;color:var(--m)}.modal{display:none;position:fixed;inset:0;background:#0c242099;padding:25px;overflow:auto;z-index:5}.modal.show{display:block}.box{max-width:950px;margin:20px auto;background:#fff;border-radius:16px;padding:20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.d{border:1px solid var(--l);padding:10px;border-radius:9px}.d small{display:block;color:var(--m);font-size:9px;text-transform:uppercase;font-weight:700}@media(max-width:1000px){.bar{grid-template-columns:1fr 1fr}.stats{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr 1fr}}@media(max-width:600px){.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}</style></head><body><header><div><h1>Karyotica Biologicals — Dealer Master</h1><small>Party / TSM / SO production dashboard</small></div><b id="total"></b></header><main class="wrap"><section class="bar"><div class="f"><label>View</label><select id="view"><option value="party">Party</option><option value="tsm">TSM</option><option value="so">SO</option></select></div><div class="f"><label>TSM</label><select id="tsm"><option value="">All TSMs</option></select></div><div class="f"><label>SO</label><select id="so"><option value="">All SOs</option></select></div><div class="f"><label>Search</label><input id="q" placeholder="Party, place, TSM or SO"></div><button class="btn alt" id="reset">Reset</button><button class="btn" id="imp">Import Excel</button><button class="btn alt" id="exp">Export CSV</button><input id="file" type="file" accept=".xlsx,.xls,.csv" hidden></section><section class="stats"><div class="card"><small>Visible</small><b id="n">0</b></div><div class="card"><small>TSMs</small><b id="nt">0</b></div><div class="card"><small>SOs</small><b id="ns">0</b></div><div class="card"><small>Discount Slabs</small><b id="nd">0</b></div><div class="card"><small>Pending Agreements</small><b id="np">0</b></div><div class="card"><small>Credit Limit</small><b id="cr">₹0</b></div></section><section class="panel"><div class="ph"><b id="heading">Party / Dealer</b><span style="color:var(--m);font-size:11px">Click a party for full details</span></div><div style="overflow:auto"><table><thead id="head"></thead><tbody id="body"></tbody></table></div></section></main><div class="modal" id="modal"><div class="box"><button class="btn alt" style="float:right" onclick="modal.classList.remove('show')">Close</button><h2 id="mt"></h2><div class="grid" id="details"></div><p><b>Remark</b></p><textarea id="remark" rows="4" placeholder="Add / update remark"></textarea><br><button class="btn" style="margin-top:8px" onclick="saveRemark()">Save Remark</button><small style="display:block;color:var(--m);margin-top:6px">Remarks are saved locally in this browser.</small></div></div><script src="data.js"></script><script>const BASE=window.DEALER_DATA||[],MK='kbpl_master_v2',RK='kbpl_remarks_v2';let data=(()=>{try{return JSON.parse(localStorage.getItem(MK))||BASE.map(x=>({...x}))}catch(e){return BASE.map(x=>({...x}))}})(),cur=null;const C=v=>v==null?'':String(v).trim(),U=a=>[...new Set(a.map(C).filter(Boolean))].sort((a,b)=>a.localeCompare(b)),E=s=>C(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function fill(id,a,label){let e=document.getElementById(id),v=e.value;e.innerHTML='<option value="">'+label+'</option>'+a.map(x=>'<option>'+E(x)+'</option>').join('');if(a.includes(v))e.value=v}function filtered(){let t=tsm.value,s=so.value,x=q.value.toLowerCase();return data.filter(r=>(!t||C(r.TSM)===t)&&(!s||C(r.SO)===s)&&(!x||[r['Name of the Customer'],r.Place,r.TSM,r.SO].map(C).join(' ').toLowerCase().includes(x)))}function render(){fill('tsm',U(data.map(r=>r.TSM)),'All TSMs');let t=tsm.value;fill('so',U(data.filter(r=>!t||C(r.TSM)===t).map(r=>r.SO)),'All SOs');let a=filtered(),v=view.value;n.textContent=a.length;nt.textContent=U(a.map(r=>r.TSM)).length;ns.textContent=U(a.map(r=>r.SO)).length;nd.textContent=U(a.map(r=>r['Approved\nDiscount \%'])).length;np.textContent=a.filter(r=>C(r['Agreement Status']).toLowerCase()!=='approved').length;cr.textContent='₹'+Math.round(a.reduce((s,r)=>s+(Number(r['Approved Credit  Limit'])||0),0)).toLocaleString('en-IN');total.textContent=data.length+' records';heading.textContent=v==='party'?'Party / Dealer':v.toUpperCase();if(v==='party'){head.innerHTML='<tr><th>Party</th><th>Place</th><th>TSM</th><th>SO</th><th>Discount</th><th>Billing</th><th>Agreement</th></tr>';body.innerHTML=a.map(r=>'<tr onclick="openRow('+data.indexOf(r)+')"><td><b>'+E(r['Name of the Customer'])+'</b></td><td>'+E(r.Place)+'</td><td>'+E(r.TSM)+'</td><td>'+E(r.SO)+'</td><td>'+E(r['Approved\nDiscount \%'])+'</td><td>'+E(r['Billing\nDiscount\n%'])+'</td><td><span class="tag '+(C(r['Agreement Status']).toLowerCase()==='approved'?'ok':'')+'">'+E(r['Agreement Status']||'Pending')+'</span></td></tr>').join('')}else{let k=v==='tsm'?'TSM':'SO',g={};a.forEach(r=>{let x=C(r[k])||'Unassigned';(g[x]??=[]).push(r)});head.innerHTML='<tr><th>'+k+'</th><th>Mapped '+(k==='TSM'?'SOs':'TSMs')+'</th><th>Dealer Count</th></tr>';body.innerHTML=Object.entries(g).sort().map(([k,z])=>'<tr><td><b>'+E(k)+'</b></td><td>'+E(U(z.map(r=>k==='TSM'?r.SO:r.TSM)).join(', '))+'</td><td>'+z.length+'</td></tr>').join('')}if(!a.length)body.innerHTML='<tr><td colspan="7" class="empty">No records found</td></tr>'}function openRow(i){cur=data[i];mt.textContent=cur['Name of the Customer'];let m={'Name of the Customer':'Party','TSM':'TSM','SO':'SO','Place':'Place','Payment\nTerms':'Payment Terms','Approved\nCredit \nLimit':'Credit Limit','Approved\nDiscount \n%':'Approved Discount %','Billing\nDiscount\n%':'Billing Discount %','Diff':'Diff','Diff\nAdjust.':'Diff Adjust.','Annual Bulk \nscheme as per slab':'Annual Bulk Scheme','Additional\nDiscount':'Additional Discount','Technical \n%':'Technical %','Approved \nBy':'Approved By','Agreement Status':'Agreement Status'};details.innerHTML=Object.entries(m).map(([k,l])=>'<div class="d"><small>'+l+'</small>'+E(cur[k]||'—')+'</div>').join('');let rr={};try{rr=JSON.parse(localStorage.getItem(RK)||'{}')}catch(e){}remark.value=rr[C(cur['Name of the Customer'])]||cur.Remarks||'';modal.classList.add('show')}function saveRemark(){let rr={};try{rr=JSON.parse(localStorage.getItem(RK)||'{}')}catch(e){}rr[C(cur['Name of the Customer'])]=remark.value;localStorage.setItem(RK,JSON.stringify(rr));alert('Remark saved')}function importX(f){let r=new FileReader();r.onload=e=>{let w=XLSX.read(e.target.result,{type:'array'}),a=XLSX.utils.sheet_to_json(w.Sheets[w.SheetNames[0]],{defval:null}),map=new Map(data.map(x=>[C(x['Name of the Customer']).toLowerCase(),x]));a.forEach(x=>{let k=C(x['Name of the Customer']).toLowerCase();if(k)map.set(k,{...(map.get(k)||{}),...x})});data=[...map.values()];localStorage.setItem(MK,JSON.stringify(data));render();alert(a.length+' rows processed. Existing parties updated and new parties added.')} ;r.readAsArrayBuffer(f)}imp.onclick=()=>file.click();file.onchange=()=>file.files[0]&&importX(file.files[0]);exp.onclick=()=>{let csv=XLSX.utils.sheet_to_csv(XLSX.utils.json_to_sheet(filtered())),u=URL.createObjectURL(new Blob([csv],{type:'text/csv'})),a=document.createElement('a');a.href=u;a.download='KBPL_Dealer_Master.csv';a.click();URL.revokeObjectURL(u)};reset.onclick=()=>{tsm.value='';so.value='';q.value='';view.value='party';render()};view.onchange=render;tsm.onchange=render;so.onchange=render;q.oninput=render;render();</script></body></html>
