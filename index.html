<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KBPL Data Manager</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7f9;color:#17212b}.wrap{max-width:1400px;margin:auto;padding:24px}.head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px}.head h1{margin:0;font-size:26px}.muted{color:#687580;font-size:13px}.card{background:#fff;border:1px solid #e2e7eb;border-radius:12px;padding:18px;margin-bottom:18px;box-shadow:0 2px 8px #00000008}.upload{display:flex;flex-wrap:wrap;gap:12px;align-items:end}.field{display:flex;flex-direction:column;gap:6px;min-width:180px}label{font-size:12px;font-weight:700;color:#53616c}input,select,button{height:40px;border:1px solid #ccd5dc;border-radius:8px;padding:0 12px;background:#fff;font:inherit}button{cursor:pointer;font-weight:700}.primary{background:#17212b;color:#fff;border-color:#17212b}.danger{color:#a33;border-color:#e4b8b8}.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.kpi{padding:16px;border:1px solid #e2e7eb;border-radius:10px;background:#fff}.kpi b{display:block;font-size:22px;margin-top:6px}.filters{display:flex;flex-wrap:wrap;gap:10px}.filters .field{min-width:180px;flex:1}.tablewrap{overflow:auto;max-height:60vh;border:1px solid #e2e7eb;border-radius:10px}table{border-collapse:collapse;width:100%;font-size:13px;background:#fff}th,td{padding:10px 12px;border-bottom:1px solid #edf0f2;text-align:left;white-space:nowrap}th{position:sticky;top:0;background:#f0f3f5;z-index:1}.status{font-size:13px;padding:10px 12px;border-radius:8px;background:#f4f7f8}.empty{text-align:center;padding:40px;color:#7b8790}.actions{display:flex;gap:8px;flex-wrap:wrap}.small{font-size:12px}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.modalbox{background:#fff;border-radius:12px;max-width:900px;width:100%;max-height:90vh;overflow:auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.grid .field{min-width:0}@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body><div class="wrap">
<div class="head"><div><h1>KBPL Data Manager</h1><div class="muted">Free browser-based data upload, update, filtering and KPI dashboard</div></div><div class="actions"><button id="backup">Backup Data</button><button id="restoreBtn">Restore Backup</button><input id="restore" type="file" accept=".json" hidden><button id="clear" class="danger">Clear Local Data</button></div></div>
<div class="card"><div class="upload"><div class="field" style="flex:1"><label>UPLOAD EXCEL / CSV</label><input id="file" type="file" accept=".xlsx,.xls,.csv"></div><div class="field"><label>PRIMARY KEY</label><select id="pk"><option>Upload a file first</option></select></div><button id="uploadBtn" class="primary">Upload & Update</button></div><div id="status" class="status" style="margin-top:12px">No data loaded yet.</div></div>
<div class="kpis"><div class="kpi"><span class="muted">Total Records</span><b id="kRecords">0</b></div><div class="kpi"><span class="muted">Numeric Total</span><b id="kTotal">0</b></div><div class="kpi"><span class="muted">Unique Values</span><b id="kUnique">0</b></div><div class="kpi"><span class="muted">Added Last Upload</span><b id="kAdded">0</b></div><div class="kpi"><span class="muted">Updated Last Upload</span><b id="kUpdated">0</b></div><div class="kpi"><span class="muted">Columns</span><b id="kCols">0</b></div></div>
<div class="card"><div class="filters"><div class="field"><label>FILTER COLUMN</label><select id="filterCol"><option value="">All columns</option></select></div><div class="field"><label>SELECT VALUE</label><select id="filterVal"><option value="">All values</option></select></div><div class="field"><label>SEARCH</label><input id="search" placeholder="Search all data..."></div><div class="field"><label>SORT BY</label><select id="sortCol"><option value="">Default</option></select></div></div></div>
<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><div><b>Data</b> <span id="count" class="muted"></span></div><button id="export">Export CSV</button></div><div class="tablewrap" id="table"></div></div>
</div>
<div class="modal" id="modal"><div class="modalbox"><h2>Edit Record</h2><div id="editGrid" class="grid"></div><div class="actions" style="margin-top:16px"><button id="saveEdit" class="primary">Save</button><button id="cancelEdit">Cancel</button></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
const DB='KBPL_DATA_MANAGER_V1',STORE='records';let rows=[],columns=[],pkCol='',editing=-1,lastUpload={added:0,updated:0};
const $=id=>document.getElementById(id);
function openDB(){return new Promise((res,rej)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE,{keyPath:'__id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function load(){let db=await openDB();return new Promise((res,rej)=>{let q=db.transaction(STORE,'readonly').objectStore(STORE).getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function saveAll(data){let db=await openDB();return new Promise((res,rej)=>{let tx=db.transaction(STORE,'readwrite'),s=tx.objectStore(STORE);s.clear();data.forEach(x=>s.add(x));tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
function normalize(v){return v===null||v===undefined?'':String(v).trim()}
function inferCols(data){let set=new Set();data.forEach(r=>Object.keys(r).forEach(k=>set.add(k)));return [...set]}
function num(v){if(typeof v==='number')return v;let n=Number(String(v??'').replace(/[₹,\s%]/g,''));return Number.isFinite(n)?n:0}
function refreshControls(){columns=inferCols(rows);let opts=columns.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');$('filterCol').innerHTML='<option value="">All columns</option>'+opts;$('sortCol').innerHTML='<option value="">Default</option>'+opts;$('pk').innerHTML=columns.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');if(pkCol&&columns.includes(pkCol))$('pk').value=pkCol;else if(columns[0]){$('pk').value=columns[0];pkCol=columns[0]} updateFilterValues();}
function updateFilterValues(){let c=$('filterCol').value;let vals=[...new Set(c?rows.map(r=>normalize(r[c])).filter(Boolean):[])].sort();$('filterVal').innerHTML='<option value="">All values</option>'+vals.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('');render()}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function filtered(){let search=$('search').value.toLowerCase(),fc=$('filterCol').value,fv=$('filterVal').value,sc=$('sortCol').value;let a=rows.filter(r=>(!fc||normalize(r[fc])===fv)&&(!search||columns.some(c=>normalize(r[c]).toLowerCase().includes(search))));if(sc)a.sort((x,y)=>normalize(x[sc]).localeCompare(normalize(y[sc]),undefined,{numeric:true,sensitivity:'base'}));return a}
function render(){let a=filtered();$('count').textContent=`(${a.length} shown of ${rows.length})`;if(!a.length){$('table').innerHTML='<div class="empty">No records found.</div>';return}let h='<table><thead><tr>'+columns.map(c=>`<th>${esc(c)}</th>`).join('')+'<th>Action</th></tr></thead><tbody>';a.forEach(r=>{let i=rows.indexOf(r);h+='<tr>'+columns.map(c=>`<td>${esc(r[c])}</td>`).join('')+`<td><button onclick="editRow(${i})">Edit</button></td></tr>`});$('table').innerHTML=h+'</tbody></table>';updateKpis(a)}
function updateKpis(a){$('kRecords').textContent=rows.length.toLocaleString();let numeric=[];columns.forEach(c=>{let vals=rows.map(r=>r[c]);if(vals.some(v=>typeof v==='number'||/^[-₹,\s\d.]+$/.test(String(v??''))))numeric.push(...vals.map(num))});$('kTotal').textContent=numeric.reduce((x,y)=>x+y,0).toLocaleString(undefined,{maximumFractionDigits:2});let unique=pkCol?new Set(rows.map(r=>normalize(r[pkCol])).filter(Boolean)).size:new Set(a.flatMap(r=>columns.map(c=>normalize(r[c])).filter(Boolean))).size;$('kUnique').textContent=unique.toLocaleString();$('kAdded').textContent=lastUpload.added;$('kUpdated').textContent=lastUpload.updated;$('kCols').textContent=columns.length}
$('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;let data=await f.arrayBuffer();let wb=XLSX.read(data,{type:'array'});let ws=wb.Sheets[wb.SheetNames[0]];let incoming=XLSX.utils.sheet_to_json(ws,{defval:''});if(!incoming.length){$('status').textContent='The file has no rows.';return}columns=inferCols(incoming);$('pk').innerHTML=columns.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');pkCol=columns[0];$('status').textContent=`Loaded ${incoming.length.toLocaleString()} rows. Select the primary key and click Upload & Update.`;e.target._rows=incoming};
$('pk').onchange=e=>pkCol=e.target.value;$('uploadBtn').onclick=async()=>{let incoming=$('file')._rows;if(!incoming?.length){$('status').textContent='Please choose an Excel/CSV file first.';return}pkCol=$('pk').value;if(!pkCol){alert('Select a primary key.');return}rows=await load();let map=new Map(rows.map((r,i)=>[normalize(r[pkCol]),i]));let newCols=inferCols([...rows,...incoming]);newCols.forEach(c=>{rows.forEach(r=>{if(!(c in r))r[c]=''});incoming.forEach(r=>{if(!(c in r))r[c]=''})});let added=0,updated=0;incoming.forEach(r=>{let key=normalize(r[pkCol]);if(!key)return;if(map.has(key)){Object.assign(rows[map.get(key)],r);updated++}else{r.__id=crypto.randomUUID();rows.push(r);map.set(key,rows.length-1);added++}});rows.forEach(r=>{if(!r.__id)r.__id=crypto.randomUUID()});await saveAll(rows);lastUpload={added,updated};refreshControls();$('status').textContent=`Update complete: ${added} added, ${updated} updated. New columns are included automatically.`;render()};
$('filterCol').onchange=updateFilterValues;$('filterVal').onchange=render;$('search').oninput=render;$('sortCol').onchange=render;
window.editRow=i=>{editing=i;let r=rows[i];$('editGrid').innerHTML=columns.map(c=>`<div class="field"><label>${esc(c)}</label><input data-c="${esc(c)}" value="${esc(r[c])}"></div>`).join('');$('modal').classList.add('show')};$('cancelEdit').onclick=()=>$('modal').classList.remove('show');$('saveEdit').onclick=async()=>{let r=rows[editing];$('editGrid').querySelectorAll('input').forEach(x=>r[x.dataset.c]=x.value);await saveAll(rows);$('modal').classList.remove('show');render()};
$('backup').onclick=()=>{let blob=new Blob([JSON.stringify({version:1,primaryKey:pkCol,columns,rows},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='KBPL_Data_Backup.json';a.click();URL.revokeObjectURL(a.href)};$('restoreBtn').onclick=()=>$('restore').click();$('restore').onchange=async e=>{let f=e.target.files[0];if(!f)return;let x=JSON.parse(await f.text());rows=x.rows||[];pkCol=x.primaryKey||'';await saveAll(rows);refreshControls();render();$('status').textContent=`Backup restored: ${rows.length.toLocaleString()} records.`};$('clear').onclick=async()=>{if(confirm('Delete all local data from this browser? This cannot be undone unless you have a backup.')){rows=[];await saveAll([]);refreshControls();render();$('status').textContent='Local data cleared.'}};$('export').onclick=()=>{let a=filtered();if(!a.length)return;let ws=XLSX.utils.json_to_sheet(a.map(r=>{let x={};columns.forEach(c=>x[c]=r[c]);return x}));let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Data');XLSX.writeFile(wb,'KBPL_Data_Export.xlsx')};
(async()=>{rows=await load();refreshControls();render()})();
</script></body></html>
