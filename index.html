<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Karyotica Biologicals — Dealer Master</title>
<style>
:root{--navy:#123b36;--green:#0b8f72;--light:#f4f8f6;--line:#dce7e2;--text:#17312d;--muted:#6c7f79;--white:#fff;--orange:#f39a38}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--light);color:var(--text)}
header{background:linear-gradient(135deg,var(--navy),#167d67);color:white;padding:22px 28px;display:flex;justify-content:space-between;align-items:center;gap:20px}header h1{margin:0;font-size:24px}header p{margin:5px 0 0;opacity:.8;font-size:13px}.badge{background:#ffffff1f;border:1px solid #ffffff33;padding:8px 12px;border-radius:20px;font-size:12px}
main{max-width:1450px;margin:22px auto;padding:0 18px}.controls,.panel,.stat{background:white;border:1px solid var(--line);border-radius:14px;box-shadow:0 5px 18px #153d3210}.controls{padding:18px;display:grid;grid-template-columns:1.3fr 1fr 1fr 1.5fr auto;gap:12px;align-items:end}.field label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:6px;text-transform:uppercase}.field select,.field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;background:#fbfdfc;color:var(--text);outline:none}.btn{border:0;border-radius:9px;padding:11px 16px;background:var(--green);color:white;font-weight:700;cursor:pointer}.btn.secondary{background:#eaf2ef;color:var(--navy)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}.stat{padding:16px}.stat small{color:var(--muted);font-weight:700}.stat strong{display:block;font-size:25px;margin-top:6px}.panel{overflow:hidden}.panel-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.panel-head h2{margin:0;font-size:16px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:11px 12px;border-bottom:1px solid #edf2f0;text-align:left;vertical-align:top}th{background:#f7faf8;color:var(--muted);font-size:11px;text-transform:uppercase;position:sticky;top:0}.clickable tbody tr{cursor:pointer}.clickable tbody tr:hover{background:#f1f8f5}.status{display:inline-block;padding:4px 8px;border-radius:20px;font-size:11px;font-weight:700}.pending{background:#fff3dd;color:#9b5c00}.approved{background:#e1f6ee;color:#087154}.empty{text-align:center;padding:45px;color:var(--muted)}
.modal{display:none;position:fixed;inset:0;background:#0c242099;z-index:5;padding:30px;overflow:auto}.modal.show{display:block}.card{max-width:900px;margin:30px auto;background:white;border-radius:16px;padding:22px}.close{float:right;border:0;background:#eef3f1;border-radius:8px;padding:7px 11px;cursor:pointer}.details{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:20px}.detail{border:1px solid var(--line);border-radius:10px;padding:12px}.detail b{display:block;font-size:10px;text-transform:uppercase;color:var(--muted);margin-bottom:4px}.remark{margin-top:16px}.remark textarea{width:100%;min-height:80px;padding:10px;border:1px solid var(--line);border-radius:9px}.hint{font-size:12px;color:var(--muted);margin-top:10px}
@media(max-width:900px){.controls{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}.details{grid-template-columns:1fr}table{min-width:1000px}.panel{overflow:auto}}
</style>
</head>
<body>
<header><div><h1>Karyotica Biologicals</h1><p>Dealer Master • Party / TSM / SO access</p></div><div class="badge" id="countBadge">Loading…</div></header>
<main>
<section class="controls">
<div class="field"><label>View by</label><select id="mode"><option value="party">Party / Dealer</option><option value="tsm">TSM</option><option value="so">SO</option></select></div>
<div class="field"><label>TSM</label><select id="tsm"><option value="">All TSMs</option></select></div>
<div class="field"><label>SO</label><select id="so"><option value="">All SOs</option></select></div>
<div class="field"><label>Search party / place</label><input id="search" placeholder="Type to search…"></div>
<button class="btn secondary" id="reset">Reset</button>
</section>
<div class="stats"><div class="stat"><small>Visible Records</small><strong id="records">0</strong></div><div class="stat"><small>TSMs</small><strong id="tsms">0</strong></div><div class="stat"><small>SOs</small><strong id="sos">0</strong></div><div class="stat"><small>Discount Slabs</small><strong id="slabs">0</strong></div></div>
<section class="panel"><div class="panel-head"><h2 id="title">Dealer Master</h2><span class="hint">Click any row for full details</span></div><div style="overflow:auto"><table class="clickable"><thead id="thead"></thead><tbody id="tbody"></tbody></table></div></section>
</main>
<div class="modal" id="modal"><div class="card"><button class="close" onclick="closeModal()">✕</button><h2 id="modalTitle">Dealer</h2><div class="details" id="details"></div><div class="remark"><b>Remark</b><textarea id="remark" placeholder="Add or update remark…"></textarea><br><button class="btn" onclick="saveRemark()" style="margin-top:8px">Save Remark</button><div class="hint">Remarks are saved in this browser using local storage. They do not modify the GitHub master file.</div></div></div></div>
<script src="data.js"></script>
<script>
const data=window.DEALER_DATA||[]; let current=null;
const clean=v=>v==null?'':String(v).trim();
const uniq=a=>[...new Set(a.map(clean).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
const fields=['Name of the Customer','TSM','SO','Place','Payment\nTerms','Approved\nCredit \nLimit','Approved\nDiscount \n%','Billing\nDiscount\n%','Diff','Diff\nAdjust.','Annual Bulk \nscheme as per slab','Additional\nDiscount','Technical \n%','Approved \nBy','Agreement Status','Remarks'];
function fillSelect(el,items,all){el.innerHTML='<option value="">'+all+'</option>'+items.map(x=>'<option>'+escapeHtml(x)+'</option>').join('')}
function escapeHtml(s){return clean(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function populate(){fillSelect(document.getElementById('tsm'),uniq(data.map(x=>x.TSM)),'All TSMs'); updateSO();}
function updateSO(){let t=document.getElementById('tsm').value;fillSelect(document.getElementById('so'),uniq(data.filter(x=>!t||clean(x.TSM)===t).map(x=>x.SO)),'All SOs'); render()}
function filtered(){let t=tsm.value,s=so.value,q=search.value.toLowerCase().trim();return data.filter(r=>(!t||clean(r.TSM)===t)&&(!s||clean(r.SO)===s)&&(!q||[r['Name of the Customer'],r.Place,r.TSM,r.SO].map(clean).join(' ').toLowerCase().includes(q)))}
function render(){let rows=filtered(),mode=document.getElementById('mode').value;records.textContent=rows.length;tsms.textContent=uniq(rows.map(r=>r.TSM)).length;sos.textContent=uniq(rows.map(r=>r.SO)).length;slabs.textContent=uniq(rows.map(r=>r['Approved\nDiscount \%'])).length;countBadge.textContent=data.length+' master records';title.textContent=mode==='party'?'Party / Dealer View':mode.toUpperCase()+' View';
let head=mode==='party'?['Party / Dealer','Place','TSM','SO','Discount %','Agreement']:mode==='tsm'?['TSM','SO Count','Dealer Count']:['SO','TSM','Dealer Count'];thead.innerHTML='<tr>'+head.map(h=>'<th>'+h+'</th>').join('')+'</tr>';
if(mode==='party'){tbody.innerHTML=rows.map((r,i)=>'<tr onclick="openRow('+data.indexOf(r)+')"><td><b>'+escapeHtml(r['Name of the Customer'])+'</b></td><td>'+escapeHtml(r.Place)+'</td><td>'+escapeHtml(r.TSM)+'</td><td>'+escapeHtml(r.SO)+'</td><td>'+escapeHtml(r['Approved\nDiscount \%'])+'</td><td><span class="status '+(clean(r['Agreement Status']).toLowerCase()==='approved'?'approved':'pending')+'">'+escapeHtml(r['Agreement Status']||'—')+'</span></td></tr>').join('')}
else{let key=mode==='tsm'?'TSM':'SO';let groups={};rows.forEach(r=>{let k=clean(r[key])||'Unassigned';(groups[k]??=[]).push(r)});tbody.innerHTML=Object.entries(groups).sort().map(([k,arr])=>'<tr onclick="filterGroup('+JSON.stringify(key)+','+JSON.stringify(k)+')"><td><b>'+escapeHtml(k)+'</b></td><td>'+(mode==='tsm'?uniq(arr.map(r=>r.SO)).length:escapeHtml(arr[0]?.TSM||''))+'</td><td>'+arr.length+'</td></tr>').join('')}
if(!rows.length)tbody.innerHTML='<tr><td colspan="6" class="empty">No records found.</td></tr>'}
function filterGroup(key,val){if(key==='TSM'){tsm.value=val;updateSO()}else{so.value=val;render()}}
function openRow(i){current=data[i];modal.classList.add('show');modalTitle.textContent=current['Name of the Customer'];let labels={'Name of the Customer':'Party / Dealer','TSM':'TSM','SO':'SO','Place':'Place','Payment\nTerms':'Payment Terms','Approved\nCredit \nLimit':'Credit Limit','Approved\nDiscount \n%':'Approved Discount %','Billing\nDiscount\n%':'Billing Discount %','Diff':'Diff','Diff\nAdjust.':'Diff Adjust.','Annual Bulk \nscheme as per slab':'Annual Bulk Scheme','Additional\nDiscount':'Additional Discount','Technical \n%':'Technical %','Approved \nBy':'Approved By','Agreement Status':'Agreement Status'};details.innerHTML=Object.entries(labels).map(([k,l])=>'<div class="detail"><b>'+l+'</b>'+escapeHtml(current[k]||'—')+'</div>').join('');remark.value=localStorage.getItem('kbpl_remark_'+clean(current['Name of the Customer']))||current.Remarks||''}
function closeModal(){modal.classList.remove('show')};function saveRemark(){if(current){localStorage.setItem('kbpl_remark_'+clean(current['Name of the Customer']),remark.value);alert('Remark saved for this browser.')}}
mode.onchange=render;tsm.onchange=updateSO;so.onchange=render;search.oninput=render;reset.onclick=()=>{tsm.value='';updateSO();search.value='';mode.value='party';render()};populate();render();
</script>
</body></html>
